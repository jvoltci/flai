[package]
name = "flai-app"
version = "1.0.0"
description = "flai — a torrent downloader that saves straight to disk"
edition = "2021"
rust-version = "1.82"

[lib]
name = "flai_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rust-tls, not the platform TLS: one fewer thing that has to exist on the build machine, and
# the Windows and Linux runners are cross-built in CI where a system OpenSSL is a liability.
librqbit = { version = "8.1.1", default-features = false, features = ["rust-tls"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
parking_lot = "0.12"

[dev-dependencies]
# The end-to-end test drives librqbit directly; it needs the macros the app itself does not.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
