# Builds the app for every platform flai claims to support.
#
# There is no way around a matrix here: a macOS bundle needs macOS, a Windows installer needs
# Windows, and Docker only ever gets you the Linux one. These runners are what makes the other
# two exist at all, and it is also the only place the Windows and Linux binaries are ever
# built — nobody has run them on the machine they were developed on.
#
# Nothing here is signed. Signing certificates cost money per year, so the first launch shows
# Gatekeeper on macOS and SmartScreen on Windows. The release notes say so plainly rather than
# leaving people to guess whether the download is safe.
name: app

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      # 22.04, not 24.04: Tauri 2 on Linux links against webkit2gtk-4.1, and the package names
      # moved in 24.04. Pinning the runner is cheaper than carrying both spellings.
      - name: Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: flai/app/src-tauri -> target
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: flai ${{ github.ref_name }}
          releaseBody: |
            Downloads torrents straight to your disk. No account, no server in the middle,
            no size limit, and it picks up where it left off if you close it.

            | Platform | File |
            |---|---|
            | macOS (Apple silicon) | `_aarch64.dmg` |
            | macOS (Intel) | `_x64.dmg` |
            | Windows | `_x64-setup.exe` |
            | Linux | `.AppImage` or `.deb` |
            | Android | `.apk` — sideload it; Play will not list a torrent client |

            **Android:** the first time, Android asks you to allow "install unknown apps" for
            whichever app opened the file — usually your browser or file manager.

            **These builds are not code-signed.** A signing certificate is a yearly fee and
            this is a free tool, so the first launch needs one extra step:

            - **macOS** — right-click the app and choose Open, then Open again. After that it
              launches normally.
            - **Windows** — SmartScreen shows "Windows protected your PC". Click More info,
              then Run anyway.

            Only the Apple silicon build has been run by a human. The rest are built here and
            never launched — if one of them misbehaves, that is why.
          releaseDraft: true
          prerelease: false

  # Android is its own job rather than a matrix row: it needs a JDK and the Android SDK that
  # none of the desktop targets want, and it produces one universal APK instead of a per-arch
  # bundle. Folding it into the matrix would mean `if:` guards on half the steps.
  android:
    name: Android
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: flai/app/src-tauri -> target
          key: android

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      # The keystore arrives base64 in a secret, because a repository cannot hold the binary,
      # and lands as keystore.properties — NOT as environment variables. The Tauri CLI builds
      # gradle's environment itself and forwards a fixed list, so anything else exported here
      # never reaches the signing config. A release build failed exactly that way once.
      #
      # An unsigned APK is not a degraded APK, it is an uninstallable one: Android rejects it
      # with "invalid package", which reads to a user as a corrupt download. So a missing key
      # fails the job rather than attaching a file nobody can install.
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD must both be set. An unsigned APK cannot be installed, so this stops rather than publishing one."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/flai.keystore"
          cat > app/src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/flai.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=flai
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Scaffold the Android project
        working-directory: app
        run: npx tauri android init

      - name: Build the APK
        working-directory: app
        run: npx tauri android build --apk

      # Belt and braces: prove it is signed before it goes near a release, because the failure
      # mode of an unsigned one is a user seeing "invalid package".
      - name: Verify the signature
        run: |
          apk=$(find app/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$apk" | head -5

      - name: Name it something a human would recognise
        id: apk
        run: |
          src=$(find app/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          cp "$src" "$RUNNER_TEMP/flai_${{ github.ref_name }}.apk"
          echo "path=$RUNNER_TEMP/flai_${{ github.ref_name }}.apk" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.path }}
          draft: true
