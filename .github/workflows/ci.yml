name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      # public/sw.js is the download engine and lives outside the bundle, so tsc never sees it.
      # These tests are the only thing standing between a typo there and a broken download.
      - run: npm test
      # `npm run build` runs tsc --noEmit first, so a type error fails the build rather than
      # shipping a bundle that only breaks at runtime.
      - run: npm run build
