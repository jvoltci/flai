<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="flai">
  <!--
    A solid brand tile with the mark knocked out of it, rather than a stroked glyph on a dark
    tile. Two reasons: a filled shape survives 16 physical pixels where a 3px stroke turns to
    grey mush, and a saturated tile is what the eye finds in a strip of twenty favicons.

    It also drops the prefers-color-scheme rule the outlined version needed. That existed
    because a near-black tile reads as a hole on a pale browser bar; #8a7ef7 does not, so one
    drawing now works on light and dark chrome alike.

    Colours are literals because /public is copied verbatim and never sees the stylesheet, so it
    cannot reach nilam's custom properties. #8a7ef7 is nilam's published brand step 9, the one
    meant for filled surfaces. #101014 is neutral step 1 in dark mode, the same value already
    duplicated in the theme-color meta tag. Re-derive both if the palette is re-solved.

    (Token names are written without their leading dashes on purpose: a double hyphen is not
    legal inside an XML comment.)
  -->
  <rect width="32" height="32" rx="7.5" fill="#8a7ef7" />
  <g fill="#101014" stroke="#101014" stroke-width="2.5" stroke-linejoin="round">
    <!-- Stem and head overlap by a pixel so no seam shows where they meet. -->
    <rect x="13.6" y="6.4" width="4.8" height="10.4" rx="2.4" stroke="none" />
    <path d="M16 24.2 8.1 15.4h15.8Z" />
  </g>
</svg>
