<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG first so Chrome and Firefox take the crisp, theme-aware one; the PNG stays as the
         fallback for Safari, which does not do SVG favicons. Order matters: browsers pick the
         last icon they understand, so the PNG must come first. -->
    <link rel="icon" type="image/png" href="/flai/flai.png" />
    <link rel="icon" type="image/svg+xml" href="/flai/favicon.svg" />
    <link rel="apple-touch-icon" href="/flai/flai.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The sRGB of --neutral-1 in dark mode, oklch(0.1750 0.0070 285) — the colour body
         paints under the photograph. Converted through OKLab rather than eyeballed; the same
         conversion reproduces nilam's own published #8a7ef7 for --brand-9, and #202020 for
         --surface, which is what the rendered card measures. A <meta> value must be a colour
         literal, so this is the ONE place in the project that cannot use var(). It was
         #0a0a0a, which matched nothing in the palette. Re-derive if the hue is re-solved. -->
    <meta name="theme-color" content="#101014" />
    <meta name="description" content="flai — paste a magnet, stream or download in your browser." />
    <link rel="manifest" href="/flai/manifest.webmanifest" />
    <!-- The photograph stays here rather than moving to styles.css because the path needs
         Vite's /flai/ substitution. The scrim rides along for the same reason: it has
         to be a background LAYER above the image, and layers cannot be split across two
         rules. --scrim twice, not once — the measurement is in src/styles.css. -->
    <style>
      body {
        background-image:
          linear-gradient(var(--scrim), var(--scrim)),
          linear-gradient(var(--scrim), var(--scrim)),
          url('/flai/index.jpg');
      }
    </style>
    <title>flai</title>
    <script type="module" crossorigin src="/flai/assets/index-BXOaiC6P.js"></script>
    <link rel="stylesheet" crossorigin href="/flai/assets/index-zG1KCo8w.css">
  </head>
  <body>
    <noscript>
      <div class="n-container flai-noscript">
        <div class="n-note n-note-warn">
          <span class="n-note-glyph" aria-hidden="true">!</span>
          <div>
            <span class="n-note-title">JavaScript is off.</span>
            flai fetches the file list and drives the player in the browser, so it needs
            scripting enabled.
          </div>
        </div>
      </div>
    </noscript>
    <div id="root"></div>
    <footer class="footer">
      <div class="footer-copyright">
        ©<script>document.write(new Date().getFullYear());</script><span>&nbsp;Copyright:</span>
        <a class="n-link" target="_blank" rel="noopener noreferrer" href="https://jvoltci.github.io/">Vehement</a>
      </div>
    </footer>
  </body>
</html>
